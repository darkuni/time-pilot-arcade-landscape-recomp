name: release
# Publish a GitHub release (Releases > Draft a new release > Publish) and this
# workflow builds Windows + macOS and attaches them to it.
# Run manually (Actions > release > Run workflow) to just get the builds as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build timepilot.exe
        env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o timepilot.exe ./cmd/timepilot
      - uses: actions/upload-artifact@v4
        with: {name: timepilot-windows, path: timepilot.exe}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - run: ./scripts/build-mac.sh
      - run: cd dist/mac && zip -qry ../../TimePilot-mac.zip "Time Pilot.app"
      - uses: actions/upload-artifact@v4
        with: {name: timepilot-mac, path: TimePilot-mac.zip}

  publish:
    if: github.event_name == 'release'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/timepilot.exe out/TimePilot-mac.zip --clobber --repo "${{ github.repository }}"
